name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Type check (mypy)
        run: uv run mypy --python-version 3.10 services utils tests main.py

      - name: Type check (pyright)
        run: uv run pyright --pythonversion 3.10

      - name: Test
        run: uv run pytest
